# Terminal capabilities. INSIDE tmux the terminal is not xterm — advertising
# xterm caps here is what garbles Claude Code's TUI on scroll (repeated leftmost
# column / stuck artifacts). tmux-256color is the terminfo written for this inner
# role; terminal-features ",*:RGB" passes 24-bit color through to the real
# terminal (Windows Terminal) so colors aren't quantized.
set-option -g default-terminal "tmux-256color"
set-option -as terminal-features ",*:RGB"

# make modifier keys work
set-window-option -g xterm-keys on

# remap prefix to backtick
unbind-key C-b
set -g prefix '`'
bind-key '`' send-prefix

# use emacs controls for copy/etc
set -gw mode-keys emacs

# mousewheel
setw -g mouse on

#1 index windows + panes
set -g base-index 1
setw -g pane-base-index 1

# auto-name windows. Claude and Grok panes get a ✳ anchor plus the directory
# name; claude-autoresume's monitor swaps that ✳ for the pane's live state glyph
# (spinner working / moon delegating / ⧗ parked at the limit / ✳ idle). The anchor
# is emitted here rather than lifted off the terminal title, which does not
# reliably carry one. Other panes just show the directory.
set -g automatic-rename on
set -g automatic-rename-format '#{?#{||:#{==:#{pane_current_command},claude},#{==:#{pane_current_command},grok}},✳ ,}#{b:pane_current_path}'

# Count of items waiting on me across projects; the board is `orch` in ~/orchestrator.
set -g status-right-length 60
set -g status-right '#(~/.local/bin/orch count) #{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,}"#{=21:pane_title}" %H:%M %d-%b-%y'
