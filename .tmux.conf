# Terminal capabilities. INSIDE tmux the terminal is not xterm — advertising
# xterm caps here is what garbles Claude Code's TUI on scroll (repeated leftmost
# column / stuck artifacts). tmux-256color is the terminfo written for this inner
# role; terminal-features ",*:RGB" passes 24-bit color through to the real
# terminal (Windows Terminal) so colors aren't quantized.
set-option -g default-terminal "tmux-256color"
set-option -as terminal-features ",*:RGB"

# make modifier keys work
set-window-option -g xterm-keys on

# remap prefix to backtick
unbind-key C-b
set -g prefix '`'
bind-key '`' send-prefix

# use emacs controls for copy/etc
set -gw mode-keys emacs

# mousewheel
setw -g mouse on

#1 index windows + panes
set -g base-index 1
setw -g pane-base-index 1

# auto-name windows. For Claude Code panes, show just its live status glyph
# (spinner while working / * when idle) — the first token of the terminal title —
# plus the directory name. Other panes just show the directory.
set -g automatic-rename on
set -g automatic-rename-format '#{?#{==:#{pane_current_command},claude},#{s/ .*//:pane_title} ,}#{b:pane_current_path}'
